apply plugin: 'com.android.application'

// Release signing. Credentials live OUTSIDE the repo:
//   1) file at $CAYDENJOY_SIGNING_PROPS, else C:/Users/Ray/keys/caydenjoy-upload.properties
//      (storeFile, storePassword, keyAlias, keyPassword), or
//   2) env vars ANDROID_KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (CI).
// There is deliberately NO default password: a release build without
// credentials must fail rather than sign with a guessable key.
def signingProps = new Properties()
def signingPropsFile = file(System.getenv('CAYDENJOY_SIGNING_PROPS') ?: 'C:/Users/Ray/keys/caydenjoy-upload.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String prop, String envName -> signingProps.getProperty(prop) ?: System.getenv(envName) }

android {
    namespace = "io.github.dallas8000_ops.caydenjoy"
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePath = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword signingValue('storePassword', 'KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "io.github.dallas8000_ops.caydenjoy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation ("androidx.appcompat:appcompat:$androidxAppCompatVersion") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation ("androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation ("androidx.core:core-splashscreen:$coreSplashScreenVersion") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation (project(':capacitor-android')) {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation (project(':capacitor-cordova-android-plugins')) {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
